<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Express Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a railway line diagram across the top; one stop per screen, reading on the left, a live demo on the right. */
  --bg:#E7ECEC; --panel:#FFFFFF; --panel-2:#F1F5F4; --canvas-bg:#F4F7F7;
  --ink:#14212B; --ink-2:#4B5B66; --line:#C3CED2;
  --brand:#1D5C48; --brand-ink:#FFFFFF; --brass:#8F6400; --brass-soft:#F4E7BF;
  --hot:#D4432B; --cold:#2C6CD6;
  --good:#1B7548; --good-soft:#DDF1E5; --hint:#8A4B00; --hint-soft:#FBEBD3;
  --sign-bg:#16232D; --sign-ink:#F3EED9;
  --skin:#E6B595; --water:#CDE3F6;
  --loco-body:#1D5C48; --loco-dark:#1C242B; --loco-wheel:#A63A2C; --loco-brass:#C59B1E;
  --font-display:'Big Shoulders Display','Arial Narrow','Roboto Condensed','Helvetica Neue',sans-serif;
  --font-body:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --panel:#172029; --panel-2:#1D2832; --canvas-bg:#121A21;
    --ink:#E7EDF1; --ink-2:#A7B5C0; --line:#34434F;
    --brand:#3FA784; --brand-ink:#06140F; --brass:#E2B544; --brass-soft:#3A3014;
    --hot:#FF6F4F; --cold:#62A5FF;
    --good:#55C690; --good-soft:#143524; --hint:#F2B25C; --hint-soft:#3A2A12;
    --sign-bg:#0A1014; --sign-ink:#F3EED9;
    --skin:#D9A886; --water:#1F3B55;
    --loco-body:#2D7F64; --loco-dark:#4A5864; --loco-wheel:#C4503F; --loco-brass:#D9B23A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --panel:#172029; --panel-2:#1D2832; --canvas-bg:#121A21;
  --ink:#E7EDF1; --ink-2:#A7B5C0; --line:#34434F;
  --brand:#3FA784; --brand-ink:#06140F; --brass:#E2B544; --brass-soft:#3A3014;
  --hot:#FF6F4F; --cold:#62A5FF;
  --good:#55C690; --good-soft:#143524; --hint:#F2B25C; --hint-soft:#3A2A12;
  --sign-bg:#0A1014; --sign-ink:#F3EED9;
  --skin:#D9A886; --water:#1F3B55;
  --loco-body:#2D7F64; --loco-dark:#4A5864; --loco-wheel:#C4503F; --loco-brass:#D9B23A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--font-body)}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1:focus{outline:none}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:14px 0 4px}
.brandmark{font:800 30px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase}
.brandmark span{color:var(--brass)}
.topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.count{font-size:16px;color:var(--ink-2)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}

/* route diagram */
.route{overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.route ol{list-style:none;display:flex;margin:0;padding:8px 0 0;min-width:max-content}
.route li{flex:1 0 78px;display:flex;flex-direction:column;align-items:center;position:relative}
.route li::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:5px;background:var(--line)}
.route li:first-child::before{display:none}
.route li.passed::before{background:var(--brand)}
.route button{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink-2);background:var(--panel);font:700 16px/1 var(--font-body);font-variant-numeric:tabular-nums;padding:0}
.route li.end button{border-radius:8px}
.route li.punched button{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.route li.cur button{border-color:var(--brass);box-shadow:0 0 0 4px var(--brass-soft)}
.route .lbl{font:400 13px/1.2 var(--font-body);margin-top:6px;color:var(--ink-2);text-align:center;max-width:76px}
.route li.cur .lbl{color:var(--ink);font-weight:700}

/* station nameboard */
.stop{display:none}
.stop.on{display:block}
.board{background:var(--sign-bg);color:var(--sign-ink);border:3px solid var(--sign-ink);box-shadow:0 0 0 4px var(--sign-bg);border-radius:8px;padding:14px 24px 16px;margin:10px 4px 22px}
.board .num{font:600 17px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.board h1{font:800 clamp(38px,7vw,64px)/.95 var(--font-display);letter-spacing:.035em;text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
.board .covers{font-size:16px;opacity:.9}

/* stop layout */
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.colL,.colR{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:900px){
  .grid{display:flex;flex-direction:column}
  .colL,.colR{display:contents}
  .bigcard{order:1}.democard{order:2}.wordscard{order:3}.railcard{order:4}.check{order:5}.extra{order:6}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.kicker{font:600 15px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:10px}
.big{font-size:23px;line-height:1.4;font-weight:700;max-width:34em;text-wrap:pretty}
.try{margin-bottom:14px;max-width:38em}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-width:38em}
.words li{padding-left:20px;position:relative}
.words li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:4px;background:var(--brand);border-radius:2px}
.railcard{background:var(--panel-2);border-left:6px solid var(--brass)}
.railcard p+p{margin-top:10px}
.railcard p{max-width:38em}
.fig{margin-top:14px}
.fig svg{max-width:100%;height:auto;display:block}

/* demo */
.cv{display:block;width:100%;height:auto;background:var(--canvas-bg);border:1px solid var(--line);border-radius:10px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn{font:700 17px/1.2 var(--font-body);padding:11px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.small{font-size:15px;padding:8px 12px}
.range{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin-top:14px}
.range label{font-weight:700}
.range output{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.range input{grid-column:1 / -1;width:100%;accent-color:var(--brand);height:30px;margin:0}
.readout{margin-top:12px;padding:10px 14px;background:var(--panel-2);border-radius:8px;font-variant-numeric:tabular-nums;min-height:3.1em}
.caps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center;font-size:15px;line-height:1.3;color:var(--ink-2)}
.caps3 b{display:block;color:var(--ink)}
.subhead{font-weight:700;margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.partbox{margin-top:12px;padding:12px 14px;background:var(--panel-2);border-radius:8px}
.partbox .btn{margin-top:10px}

/* checks */
.check .q+.q{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.qt{font-weight:700;font-size:19px;margin-bottom:10px;max-width:34em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:400 17px/1.35 var(--font-body);padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
.opt.wrong{opacity:.55;text-decoration:line-through}
.fb{margin-top:10px;padding:0;min-height:1.5em}
.fb.good{color:var(--good);font-weight:700;background:var(--good-soft);padding:10px 14px;border-radius:8px}
.fb.hint{color:var(--hint);background:var(--hint-soft);padding:10px 14px;border-radius:8px}
.punchnote{margin-top:16px;padding:12px 14px;border:2px dashed var(--good);border-radius:8px;font-weight:700;color:var(--good)}

/* extras */
.waterstop{border:2px dashed var(--cold);background:var(--panel)}
.waterstop .kicker{color:var(--cold)}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.foot{margin-top:28px;font-size:15px;color:var(--ink-2);max-width:60em}

/* sorting yard */
.carcard{border:3px solid var(--ink);border-radius:10px;padding:16px 18px;background:var(--panel-2)}
.carcard .n{font:600 15px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.carcard .t{font-size:21px;font-weight:700;line-height:1.35}
.sortbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media (max-width:520px){.sortbtns{grid-template-columns:1fr}}
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
@media (max-width:620px){.tracks{grid-template-columns:1fr}}
.track{border-bottom:5px solid var(--ink-2);padding-bottom:6px;min-height:92px;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.track h3{margin:0;font:800 20px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.track .hintline{font-size:14px;color:var(--ink-2);margin-bottom:auto}
.car{display:inline-block;align-self:flex-start;background:var(--brand);color:var(--brand-ink);border-radius:5px;padding:4px 10px;font-size:15px;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.three{grid-template-columns:1fr}}
.three .card h3{margin:0 0 6px;font:800 24px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.three .card p{font-size:16.5px}
.tagline{font-weight:700;color:var(--brass)}

/* terminus */
.ticket{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px dashed var(--ink-2);border-radius:8px;font-size:15px;line-height:1.2;background:var(--panel);text-align:left}
.slot .hole{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink-2);display:grid;place-items:center;font-size:14px;font-weight:700}
.slot.punched{border-style:solid;border-color:var(--good)}
.slot.punched .hole{background:var(--good);border-color:var(--good);color:var(--panel)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vcard{min-height:124px;text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font:400 16px/1.35 var(--font-body)}
.vcard .term{font:800 24px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.vcard .tap{font-size:14px;color:var(--ink-2)}
.vcard.open{border-color:var(--brand);background:var(--panel-2)}
.vcard .pic{color:var(--brass);font-weight:700;font-size:15px}
.final .btn{margin-top:14px}
.missed{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.missed li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sectionhead{font:800 30px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;margin:30px 0 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="brandmark">Thermal <span>Express</span></p>
    <div class="topright">
      <p class="count">Ticket punched: <b id="count">0 of 12</b></p>
      <button type="button" class="btn small" id="pauseBtn" aria-pressed="false">Pause motion</button>
    </div>
  </header>
  <nav class="route" id="route" aria-label="Stops on the line"><ol id="route-list"></ol></nav>
  <main id="main"></main>
  <footer class="foot"><p>Built from the class notes “Thermal Energy &amp; Molecular Motion (General Concepts)”. The Words for the test boxes follow those notes. The railroad facts are extra, to help the ideas stick.</p></footer>
</div>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function el(tag,attrs){
  const e=document.createElement(tag);attrs=attrs||{};
  for(const k in attrs){const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  const add=kid=>{if(kid==null||kid===false)return;if(Array.isArray(kid)){kid.forEach(add);return;}e.append(kid.nodeType?kid:document.createTextNode(String(kid)));};
  for(let i=2;i<arguments.length;i++)add(arguments[i]);
  return e;
}
/* colors read from the theme tokens */
const K={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ['bg','panel','panel-2','canvas-bg','ink','ink-2','line','brand','brass','hot','cold','skin','water','loco-body','loco-dark','loco-wheel','loco-brass','good'].forEach(n=>{K[n]=cs.getPropertyValue('--'+n).trim();});
  K.font=cs.getPropertyValue('--font-body').trim();
  K.fontD=cs.getPropertyValue('--font-display').trim();
}
/* slow/cool = blue, fast/hot = red */
const TC=[[58,124,236],[170,84,190],[240,82,48]];
function tcol(t,a){
  t=clamp(t,0,1);const i=t<.5?0:1,f=t<.5?t*2:(t-.5)*2,A=TC[i],B=TC[i+1];
  const r=Math.round(lerp(A[0],B[0],f)),g=Math.round(lerp(A[1],B[1],f)),b=Math.round(lerp(A[2],B[2],f));
  return a==null?'rgb('+r+','+g+','+b+')':'rgba('+r+','+g+','+b+','+a+')';
}
function dot(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=f;c.fill();}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
let FS=1;
function tx(c,s,x,y,o){o=o||{};c.font=(o.w||400)+' '+(o.s||18)*(o.k?1:FS)+'px '+(o.d?K.fontD:K.font);c.fillStyle=o.c||K.ink;c.textAlign=o.a||'left';c.textBaseline=o.b||'alphabetic';c.fillText(s,x,y);}
function tag(c,s,x,y,o){o=o||{};const sz=(o.s||17)*FS;c.font=(o.w||700)+' '+sz+'px '+K.font;const w=c.measureText(s).width+14;const x0=o.a==='center'?x-w/2:o.a==='right'?x-w:x;
  c.globalAlpha=.9;rr(c,x0,y-sz-3,w,sz+11,6);c.fillStyle=K.panel;c.fill();c.globalAlpha=1;tx(c,s,x0+7,y,{s:sz,k:1,w:o.w||700,c:o.c});}
function arrow(c,x1,y1,x2,y2,col,w){w=w||3;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  const a=Math.atan2(y2-y1,x2-x1),s=w*3.2;c.beginPath();c.moveTo(x2+Math.cos(a)*s*.6,y2+Math.sin(a)*s*.6);c.lineTo(x2-Math.cos(a-.55)*s,y2-Math.sin(a-.55)*s);c.lineTo(x2-Math.cos(a+.55)*s,y2-Math.sin(a+.55)*s);c.closePath();c.fill();c.lineCap='butt';}
function flames(c,x,yb,w,hh,t,n){n=n||5;const fw=w/n;
  for(let pass=0;pass<2;pass++){c.fillStyle=pass?'#FFD24A':'#F0812A';
    for(let i=0;i<n;i++){const bx=x+(i+.5)*fw,f=(.62+.38*Math.sin(t*8+i*2.1))*(pass?.55:1)*hh,sw=Math.sin(t*5+i*1.3)*fw*.18,hw=fw*(pass?.36:.62);
      c.beginPath();c.moveTo(bx-hw,yb);c.quadraticCurveTo(bx-hw*.9,yb-f*.55,bx+sw,yb-f);c.quadraticCurveTo(bx+hw*.9,yb-f*.55,bx+hw,yb);c.closePath();c.fill();}}}
function thermo(c,x,yTop,len,frac,o){o=o||{};const w=o.w||12,br=w*1.25,yb=yTop+len,by=yb+br*.7;
  c.lineWidth=2.5;c.strokeStyle=K.ink;rr(c,x-w/2,yTop,w,len+6,w/2);c.fillStyle=K.panel;c.fill();c.stroke();
  dot(c,x,by,br,K.panel);c.beginPath();c.arc(x,by,br,0,TAU);c.stroke();
  const col=o.col||K.hot;dot(c,x,by,br-3.5,col);const lh=clamp(frac,0,1)*(len-6);c.fillStyle=col;c.fillRect(x-w/2+3.5,yb-lh,w-7,lh+br*.5);}
function moveIn(p,sp,dt,x0,y0,x1,y1){
  p.x+=Math.cos(p.a)*sp*dt;p.y+=Math.sin(p.a)*sp*dt;
  if(p.x<x0){p.x=x0;p.a=Math.PI-p.a;}else if(p.x>x1){p.x=x1;p.a=Math.PI-p.a;}
  if(p.y<y0){p.y=y0;p.a=-p.a;}else if(p.y>y1){p.y=y1;p.a=-p.a;}
}
function repel(arr,d){for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const a=arr[i],b=arr[j];let dx=b.x-a.x,dy=b.y-a.y;const q=dx*dx+dy*dy;
  if(q<d*d&&q>1e-4){const m=Math.sqrt(q),o=(d-m)/2/m;dx*=o;dy*=o;a.x-=dx;a.y-=dy;b.x+=dx;b.y+=dy;}}}
function diffuse(u,D,dt,left){const n=Math.max(1,Math.ceil(D*dt/.2)),a=D*dt/n;
  for(let s=0;s<n;s++){let prev=u[0];if(left!=null)u[0]=left;else u[0]=prev+a*(u[1]-prev);
    for(let i=1;i<u.length;i++){const cur=u[i],nx=i+1<u.length?u[i+1]:cur;u[i]=cur+a*(prev-2*cur+nx);prev=cur;}}}
const pulse=u=>u<=0||u>=1?0:Math.pow(Math.sin(Math.PI*u),2);

/* ================= scenes ================= */
const sceneMap={};let curId=null;
let paused=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function syncPause(){const b=$('#pauseBtn');b.textContent=paused?'Play motion':'Pause motion';b.setAttribute('aria-pressed',String(paused));}
function wake(){if(paused){paused=false;syncPause();}}
function mkCanvas(W,H,label){const c=el('canvas',{class:'cv',role:'img','aria-label':label});c.width=W;c.height=H;c.style.aspectRatio=W+' / '+H;return c;}
function addScene(id,sc){(sceneMap[id]=sceneMap[id]||[]).push(sc);}
function btn(label,fn,cls){return el('button',{type:'button',class:'btn'+(cls?' '+cls:''),onclick:function(e){wake();fn(e);}},label);}
let rid=0;
function range(label,min,max,val,fn,fmt){const id='r'+(++rid);const out=el('output',{for:id},fmt(val));
  const inp=el('input',{type:'range',id:id,min:min,max:max,value:val,step:1});
  inp.addEventListener('input',()=>{const v=+inp.value;out.textContent=fmt(v);fn(v);});
  return el('div',{class:'range'},el('label',{for:id},label),out,inp);}
function setText(node,s){if(node.__s!==s){node.__s=s;node.innerHTML=s;}}
let lastT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000)||0;lastT=ts;
  const list=sceneMap[curId]||[];
  for(const sc of list){
    const w=sc.cv.getBoundingClientRect().width;if(w<2)continue;
    if(!paused)sc.update(dt);

/* ---------- 3. heat: three blocks and a graph ---------- */
function demoBlocks(root,id){
  const W=640,H=392,T0=[95,35,5],TMAX=30,bw=150,bh=96,by=46;
  const cv=mkCanvas(W,H,'Three solid blocks at 95, 35 and 5 degrees Celsius, and a graph of their temperatures over time. When the blocks touch, the three lines move together and become flat.');
  let T=T0.slice(),coupled=false,time=0,gap=26,t=0,acc=0,hist=[[0].concat(T0)];
  const lat=[];for(let r=0;r<4;r++)for(let c=0;c<6;c++)lat.push({x:14+c*24.4,y:14+r*22.7,p:rand(0,TAU),q:rand(0,TAU)});
  const lc=[tcol(.97),tcol(.5),tcol(.03)];
  const out=el('p',{class:'readout'});
  const bC=btn('Couple the blocks',()=>{coupled=!coupled;bC.textContent=coupled?'Uncouple the blocks':'Couple the blocks';});bC.classList.add('primary');
  const bR=btn('Start again',()=>{T=T0.slice();time=0;acc=0;hist=[[0].concat(T0)];coupled=false;bC.textContent='Couple the blocks';});
  addScene(id,{cv,W,H,
    update(dt){t+=dt;gap+=((coupled?0:26)-gap)*Math.min(1,dt*7);
      if(coupled&&gap<1.5&&time<TMAX){const k=.22,a=(T[0]-T[1])*k*dt,b=(T[1]-T[2])*k*dt;T[0]-=a;T[1]+=a-b;T[2]+=b;time+=dt;acc+=dt;if(acc>.12){acc=0;hist.push([time,T[0],T[1],T[2]]);}}},
    draw(c){
      const spread=Math.max(T[0],T[1],T[2])-Math.min(T[0],T[1],T[2]),touch=coupled&&gap<1.5;
      setText(out,!touch&&time===0?'The blocks are apart. Nothing is being transferred yet.':
        !touch?'The blocks are apart, so the transfer has stopped.':
        spread>1.5?'Thermal energy is flowing from hotter to cooler. The brass arrows show the direction.':
        '<b>Thermal equilibrium.</b> All three blocks are '+Math.round(T[1])+' °C. Net heat transfer has stopped, so the lines are flat.');
      const total=3*bw+2*gap,x0=(W-total)/2;
      for(let i=0;i<3;i++){const x=x0+i*(bw+gap),f=T[i]/100;
        rr(c,x,by,bw,bh,6);c.fillStyle=K.panel;c.fill();c.lineWidth=3;c.strokeStyle=K.ink;c.stroke();
        const am=1+f*5.5,sp=6+f*16;for(const p of lat)dot(c,x+p.x+Math.sin(t*sp+p.p)*am,by+p.y+Math.cos(t*sp*.9+p.q)*am,5,tcol(f));
        tx(c,Math.round(T[i])+' °C',x+bw/2,by-12,{s:23,w:700,a:'center'});
        tx(c,'Block '+'ABC'[i],x+bw/2,by+bh+21,{s:16,a:'center',c:K['ink-2']});}
      if(touch)for(let i=0;i<2;i++){const d=T[i]-T[i+1];if(Math.abs(d)>1.5){const xb=x0+(i+1)*bw+i*gap+gap/2,dir=d>0?1:-1;arrow(c,xb-20*dir,by-19,xb+20*dir,by-19,K.brass,4);}}
      /* graph */
      const gx=64,gy=196,gw=556,gh=150,X=s=>gx+s/TMAX*gw,Y=v=>gy+gh-v/100*gh;
      c.lineWidth=1;c.strokeStyle=K.line;[0,50,100].forEach(v=>{c.beginPath();c.moveTo(gx,Y(v));c.lineTo(gx+gw,Y(v));c.stroke();tx(c,String(v),gx-8,Y(v)+5,{s:15,a:'right',c:K['ink-2']});});
      c.lineWidth=2;c.strokeStyle=K.ink;c.beginPath();c.moveTo(gx,gy);c.lineTo(gx,gy+gh);c.lineTo(gx+gw,gy+gh);c.stroke();
      tx(c,'Temperature (°C)',gx,gy-12,{s:15,c:K['ink-2']});tx(c,'Time →',gx+gw,gy+gh+24,{s:15,a:'right',c:K['ink-2']});
      for(let j=0;j<3;j++){c.lineWidth=4;c.lineJoin='round';c.strokeStyle=lc[j];c.beginPath();hist.forEach((h,i)=>{const x=X(h[0]),y=Y(h[j+1]);if(i)c.lineTo(x,y);else c.moveTo(x,y);});
        if(time>0)c.lineTo(X(time),Y(T[j]));c.stroke();dot(c,X(0),Y(T0[j]),6,lc[j]);dot(c,gx+gw-150+j*56,gy-17,6,lc[j]);tx(c,'ABC'[j],gx+gw-140+j*56,gy-12,{s:16,w:700});}
      if(time===0)tx(c,'Press Couple the blocks to start the graph.',gx+gw/2+30,gy+gh/2+6,{s:17,a:'center',c:K['ink-2']});
      else if(spread<=1.5)tag(c,'Flat lines: thermal equilibrium',X(TMAX)-8,Y(T[1])-14,{a:'right'});
    }});
  root.append(cv,el('div',{class:'controls'},bC,bR),out);
}

      [{x:150,n:'1 kg of steel',T:Ts},{x:460,n:'1 kg of water',T:Tw}].forEach((o,i)=>{

/* ---------- 5. changing state ---------- */
function demoState(root,id){

  for(let i=0;i<N;i++){const r=Math.floor(i/C),col=i%C,hx=box.x+box.w/2+(col-2.5)*SP,hy=box.y+box.h-17-(4-r)*SP;P.push({hx,hy,x:hx,y:hy,a:rand(0,TAU),k:rand(.75,1.25),p:rand(0,TAU),q:rand(0,TAU),m:'s'});}
  const Tof=e=>e<1?-40+40*e:e<3?0:e<5.5?(e-3)/2.5*100:e<9?100:100+(e-9)*40;
  const out=el('p',{class:'readout'});

    update(dt){t+=dt;if(dir){E=clamp(E+dir*.55*dt,0,10);if(E<=0||E>=10)setDir(0);}
      const T=Tof(E),nG=Math.round(clamp((E-5.5)/3.5,0,1)*N),nL=Math.round(clamp((E-1)/2,0,1)*N);
      const x0=box.x+10,x1=box.x+box.w-10,yb=box.y+box.h-10,pt=yb-Math.max(26,76*(N-nG)/N),ls=20+42*clamp(T/100,0,1),gs=115+(T-100)*1.2;
      for(let i=0;i<N;i++){const p=P[i];p.m=i<nG?'g':i<nL?'l':'s';
        if(p.m==='s'){const f=Math.min(1,dt*7);p.x+=(p.hx-p.x)*f;p.y+=(p.hy-p.y)*f;}
        else if(p.m==='l'){p.a+=rand(-1,1)*dt*3;if(p.y<pt-1){p.y+=170*dt;p.x=clamp(p.x+Math.cos(p.a)*ls*dt,x0,x1);}else moveIn(p,ls*p.k,dt,x0,pt,x1,yb);}

/* ---------- 11b. touch test ---------- */
function demoTouch(root,id){
  const W=640,H=262;
  const cv=mkCanvas(W,H,'A hand above a metal handrail and a hand above a wooden bench. Both objects are 20 degrees Celsius. When touched, energy leaves the hand quickly into the metal and slowly into the wood.');
  const S=[{x:168,n:'Metal handrail',col:'#9AA6AF',rate:18,spread:150,to:23,tau:1.1,on:false,hy:0,skin:33,acc:0,d:[]},
           {x:472,n:'Wooden bench',col:'#B58A5A',rate:2.4,spread:16,to:31,tau:3,on:false,hy:0,skin:33,acc:0,d:[]}];
  const out=el('p',{class:'readout'});
  const bs=S.map((o,i)=>{const b=btn(i?'Touch the wood':'Touch the metal',()=>{o.on=!o.on;b.setAttribute('aria-pressed',String(o.on));});b.setAttribute('aria-pressed','false');return b;});
  addScene(id,{cv,W,H,
    update(dt){S.forEach(o=>{o.hy+=((o.on?1:0)-o.hy)*Math.min(1,dt*9);const touch=o.on&&o.hy>.9;
      o.skin+=((touch?o.to:33)-o.skin)*Math.min(1,dt/(touch?o.tau:1.5));
      if(touch){o.acc+=dt*o.rate;while(o.acc>=1){o.acc-=1;o.d.push({x:o.x+rand(-26,26),y:178,vx:rand(-1,1)*o.spread,vy:rand(14,30),age:0});}}
      for(let i=o.d.length-1;i>=0;i--){const p=o.d[i];p.age+=dt;p.x+=p.vx*dt;p.y=Math.min(204,p.y+p.vy*dt);if(p.age>1.1||Math.abs(p.x-o.x)>118)o.d.splice(i,1);}});},
    draw(c){
      const m=S[0],w=S[1];
      setText(out,(!m.on&&!w.on)?'Both thermometers read <b>20 °C</b>. Press a button to touch.':
        'Both are still <b>20 °C</b>.'+(m.on?' Metal: energy leaves your hand fast, so it <b>feels cold</b>.':'')+(w.on?' Wood: energy leaves your hand slowly, so it <b>feels close to normal</b>.':''));
      S.forEach(o=>{
        tx(c,o.n,o.x,30,{s:25,w:800,d:1,a:'center'});
        c.fillStyle=o.col;c.fillRect(o.x-124,176,248,34);c.lineWidth=3;c.strokeStyle=K.ink;c.strokeRect(o.x-124,176,248,34);
        for(const p of o.d){c.globalAlpha=clamp(1-p.age/1.1,0,1);dot(c,p.x,p.y,4,K.hot);}c.globalAlpha=1;
        const hy=62+o.hy*56;rr(c,o.x-40,hy,80,58,[14,14,22,22]);c.fillStyle=K.skin;c.fill();c.lineWidth=3;c.strokeStyle=K.ink;c.stroke();
        c.beginPath();c.ellipse(o.x-48,hy+26,10,19,-.35,0,TAU);c.fillStyle=K.skin;c.fill();c.stroke();
        c.fillStyle=K.skin;c.fillRect(o.x-37,hy+14,10,26);
        tx(c,'your skin',o.x,hy+26,{s:14,a:'center',c:'#4A2E1E'});tx(c,Math.round(o.skin)+' °C',o.x,hy+46,{s:18,w:700,a:'center',c:'#4A2E1E'});
        tx(c,'Thermometer on it: 20 °C',o.x,238,{s:16,a:'center',c:K['ink-2']});
      });
    }});
  root.append(cv,el('div',{class:'controls'},bs),out);
}

/* ---------- 12. water against air ---------- */
function demoWaterAir(root,id){
  const W=640,H=300,y0=58,y1=250;
  const cv=mkCanvas(W,H,'Two boxes at 16 degrees Celsius above a strip of skin. The air box has a few particles. The water box has many particles moving at the same speed, so many more of them hit the skin.');
  const B=[{x0:24,x1:304,n:'AIR, 16 °C',N:6,hits:0,P:[],F:[]},{x0:336,x1:616,n:'WATER, 16 °C',N:64,hits:0,P:[],F:[]}];
  B.forEach(b=>{for(let i=0;i<b.N;i++){let a=rand(0,TAU);if(Math.abs(Math.sin(a))<.3)a+=.6;b.P.push({x:rand(b.x0+8,b.x1-8),y:rand(y0+8,y1-8),a:a});}});
  const out=el('p',{class:'readout'});
  addScene(id,{cv,W,H,
    update(dt){B.forEach(b=>{for(const p of b.P){p.x+=Math.cos(p.a)*95*dt;p.y+=Math.sin(p.a)*95*dt;
        if(p.x<b.x0+6){p.x=b.x0+6;p.a=Math.PI-p.a;}else if(p.x>b.x1-6){p.x=b.x1-6;p.a=Math.PI-p.a;}
        if(p.y<y0+6){p.y=y0+6;p.a=-p.a;}else if(p.y>y1-6){p.y=y1-6;p.a=-p.a;b.hits++;b.F.push({x:p.x,age:0});}}
      for(let i=b.F.length-1;i>=0;i--){b.F[i].age+=dt;if(b.F[i].age>.4)b.F.splice(i,1);}});},
    draw(c){
      const a=B[0].hits,w=B[1].hits;
      setText(out,'Hits on your skin so far: air <b>'+a+'</b>, water <b>'+w+'</b>.<br>'+(a>=3?'The water has hit your skin about <b>'+Math.round(w/a)+' times</b> as often. Each hit carries a little thermal energy away.':'Same temperature means the same average particle speed. Keep watching the counters.'));
      B.forEach(b=>{
        tx(c,b.n,b.x0,34,{s:24,w:800,d:1});tx(c,'hits: '+b.hits,b.x1,34,{s:18,w:700,a:'right'});
        c.fillStyle=K.panel;c.fillRect(b.x0,y0,b.x1-b.x0,y1-y0);
        c.fillStyle=K.skin;c.fillRect(b.x0,y1,b.x1-b.x0,24);
        for(const f of b.F){c.globalAlpha=1-f.age/.4;c.strokeStyle=K.hot;c.lineWidth=3;c.beginPath();c.arc(f.x,y1,4+f.age*36,Math.PI,0);c.stroke();}c.globalAlpha=1;
        for(const p of b.P)dot(c,p.x,p.y,5.5,tcol(.32));
        c.lineWidth=3;c.strokeStyle=K.ink;c.strokeRect(b.x0,y0,b.x1-b.x0,y1-y0+24);
        tx(c,'your skin',(b.x0+b.x1)/2,y1+17,{s:15,a:'center',c:'#4A2E1E'});
      });
    }});
  root.append(cv,el('div',{class:'controls'},btn('Reset the counters',()=>{B.forEach(b=>{b.hits=0;});})),out);
}

  if(!STOPS.some(s=>s.id===id))id='departure';
  curId=id;state.cur=id;save();
  $$('.stop').forEach(s=>s.classList.toggle('on',s.dataset.id===id));updateRoute();
  try{if(location.hash.slice(1)!==id)location.hash=id;}catch(e){}
  if(!quiet){window.scrollTo(0,0);const hd=$('.stop.on h1');if(hd)hd.focus({preventScroll:true});}
}
function start(data){
  try{const sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&Array.isArray(sv.punched))state={cur:sv.cur||'departure',punched:sv.punched};}catch(e){}
  if(data&&Array.isArray(data.punched))state={cur:data.cur||'departure',punched:data.punched};
  state.punched=state.punched.filter(id=>STOPS.some(s=>s.id===id&&s.num));
  readColors();
  const ol=$('#route-list'),main=$('#main');
  STOPS.forEach((s,i)=>{
    ol.append(el('li',{'data-id':s.id,class:s.num?null:'end'},el('button',{type:'button','aria-label':(s.num?'Stop '+s.num+': ':'')+s.name,onclick:()=>go(s.id)},s.num?String(s.num):''),el('span',{class:'lbl'},s.short)));
    main.append(buildStop(s,i));});
  $('#pauseBtn').addEventListener('click',()=>{paused=!paused;syncPause();});syncPause();
  new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
  if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',readColors);}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(readColors);
  window.addEventListener('hashchange',()=>{const hsh=location.hash.slice(1);if(hsh&&hsh!==curId)go(hsh);});
  const hsh=location.hash.slice(1);
  go(STOPS.some(s=>s.id===hsh)?hsh:state.cur,true);
  requestAnimationFrame(loop);
}
start({});
})();
</script>
